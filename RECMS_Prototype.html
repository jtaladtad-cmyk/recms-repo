<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECMS Working Prototype</title>
<style>
:root{
  --g:#0B5A38; --g2:#0F6E45; --gd:#073D26; --gl:#E6F1EA; --gold:#C9A227; --goldl:#FBF3D9;
  --bg:#F3F5F1; --card:#FFFFFF; --line:#DCE2DA; --line2:#EEF1EC; --ink:#18221D; --mut:#56635C;
  --red:#B42318; --redbg:#FDECEA; --amb:#8A5600; --ambbg:#FFF3D6; --blue:#1B5A93; --bluebg:#E7F0F9;
  --grn:#136B42; --grnbg:#E3F3EA; --gray:#4A5550; --graybg:#ECEFEC;
  --r:10px; --sh:0 1px 2px rgba(16,32,24,.06),0 2px 8px rgba(16,32,24,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
h1{font-size:24px;line-height:1.25;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
p{margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 18px}
.muted{color:var(--mut)}
.small{font-size:13px}
.mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:13px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;flex-wrap:wrap;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:12px}
.brand b{display:block;font-size:18px;letter-spacing:.06em}
.brand span{display:block;font-size:12px;opacity:.85}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-size:12px;opacity:.95;display:flex;align-items:center;gap:6px}
.who select{background:#fff;color:var(--ink);border:0;border-radius:7px;padding:6px 8px;font-size:13.5px;max-width:260px}
.tg{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.tg.on{background:var(--gold);border-color:var(--gold);color:#1d1600;font-weight:600}
.tg.test{border-color:var(--gold)}
.bell{position:relative;background:transparent;border:0;color:#fff;cursor:pointer;padding:6px;border-radius:8px}
.bell:hover{background:rgba(255,255,255,.12)}
.bell .badge{position:absolute;top:0;right:0;background:var(--gold);color:#1d1600;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}

/* test bar */
#testbar:empty{display:none}
.tbar{background:#1F2A24;color:#fff;padding:9px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:61px;z-index:25}
.tbar .tk{font-weight:700;color:var(--gold)}
.tbar .sc{flex:1 1 360px;font-size:13.5px;opacity:.95}
.tbar .clock{font-family:Consolas,monospace;font-size:18px;background:#000;padding:2px 10px;border-radius:6px}
.tbar button{background:#fff;color:#1F2A24;border:0;border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.tbar button.fail{background:#F3D3CF;color:#6B140C}

/* shell */
.shell{display:flex;min-height:calc(100vh - 64px)}
#nav{width:236px;flex:0 0 236px;background:#fff;border-right:1px solid var(--line);padding:18px 12px}
#nav .role{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:0 10px 8px}
#nav .uname{font-weight:700;margin:0 10px 2px}
#nav .urole{font-size:12.5px;color:var(--mut);margin:0 10px 16px}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink);margin-bottom:2px}
.navbtn:hover{background:var(--line2)}
.navbtn.on{background:var(--gl);color:var(--gd);font-weight:650}
.navbtn .n{background:var(--g);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 8px;font-weight:700}
#main{flex:1;padding:26px 30px 60px;max-width:1180px;min-width:0}

/* cards etc */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
.grid2b{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.pri:hover{background:var(--g2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--g);padding:4px 6px;text-decoration:underline}
.btn.danger{color:var(--red);border-color:#F0C4BF}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFBF9}
.chip{display:inline-block;font-size:12px;font-weight:650;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st-ver{background:var(--bluebg);color:var(--blue)}
.st-asg{background:var(--bluebg);color:var(--blue)}
.st-rev{background:var(--ambbg);color:var(--amb)}
.st-ret{background:#FDE7DC;color:#9A3412}
.st-rer{background:var(--ambbg);color:var(--amb)}
.st-app{background:var(--grnbg);color:var(--grn)}
.st-dis{background:var(--graybg);color:var(--gray)}
.tag{display:inline-block;font-size:11.5px;font-weight:650;border-radius:5px;padding:1px 7px;background:var(--graybg);color:var(--gray)}
.tag.req{background:#FDE7DC;color:#9A3412}
.tag.sug{background:var(--bluebg);color:var(--blue)}
.tag.cla{background:var(--goldl);color:#7A5B00}
.crumb{font-size:13px;color:var(--mut);margin-bottom:10px}
.crumb button{border:0;background:none;color:var(--g);cursor:pointer;padding:0;text-decoration:underline;font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:13.5px;margin:6px 0 18px;align-items:center}
.flash{background:var(--grnbg);border:1px solid #BFE3CE;color:var(--grn);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-weight:600}
.alert{background:#FFF4E5;border:1px solid #F4D19B;border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.errbox{background:var(--redbg);border:1px solid #F3C1BB;color:#7A1A12;border-radius:8px;padding:10px 14px;margin:10px 0}
.errbox ul{margin:4px 0 0 18px;padding:0}

/* forms */
.field{margin-bottom:16px}
.field label.lb{display:block;font-weight:650;margin-bottom:5px}
.field .hint{font-size:13px;color:var(--mut);margin:-2px 0 6px}
.req{color:var(--red)}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid #C8D0C8;border-radius:8px;padding:9px 11px;background:#fff}
textarea{min-height:96px;resize:vertical}
input.bad,select.bad,textarea.bad{border-color:var(--red);box-shadow:0 0 0 2px rgba(180,35,24,.12)}
.ferr{color:var(--red);font-size:13px;margin-top:5px;font-weight:600}
.counter{font-size:12.5px;color:var(--mut);text-align:right;margin-top:3px}
.readonly{background:var(--line2);border:1px dashed var(--line);border-radius:8px;padding:9px 11px}

/* wizard */
.steps{display:flex;gap:0;margin:4px 0 20px;counter-reset:s}
.steps div{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mut);font-size:14px;padding:10px 12px;border-bottom:3px solid var(--line)}
.steps div b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--mut);font-size:12.5px}
.steps div.on{color:var(--gd);border-color:var(--g)}
.steps div.on b{background:var(--g);color:#fff}
.steps div.ok{color:var(--g);border-color:#9CC9AF}
.steps div.ok b{background:#9CC9AF;color:#fff}
.docrow{display:grid;grid-template-columns:1fr 340px;gap:14px;padding:13px 0;border-bottom:1px solid var(--line2);align-items:start}
.docrow:last-child{border-bottom:0}
.fileok{display:flex;align-items:center;gap:8px;background:var(--grnbg);border:1px solid #C3E4D1;border-radius:8px;padding:7px 10px;font-size:13.5px}
.filebad{background:var(--redbg);border:1px solid #F3C1BB;border-radius:8px;padding:7px 10px;font-size:13.5px}
.fname{font-weight:600}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:#fff}
.rc:hover{border-color:#9CC9AF}
.rc.on{border-color:var(--g);background:var(--gl)}
.rc input{margin-top:4px;accent-color:var(--g)}
.rc b{display:block}
.rc span{font-size:13px;color:var(--mut)}
.cmt{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#FCFDFB}
.cmt .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:13px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--mut)}
.kv dd{margin:0}
.done{text-align:center;padding:34px 20px}
.done .ic{width:62px;height:62px;border-radius:50%;background:var(--grnbg);color:var(--grn);display:grid;place-items:center;margin:0 auto 14px}
.nextsteps{text-align:left;max-width:520px;margin:18px auto 0;padding:0;list-style:none;counter-reset:n}
.nextsteps li{counter-increment:n;display:flex;gap:10px;margin-bottom:10px}
.nextsteps li:before{content:counter(n);flex:0 0 24px;height:24px;border-radius:50%;background:var(--gl);color:var(--gd);font-weight:700;font-size:12.5px;display:grid;place-items:center}

/* tracker */
.tracker{display:flex;margin:4px 0 18px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 10px}
.tracker div{flex:1;text-align:center;position:relative;font-size:12.5px;color:var(--mut);padding:0 4px}
.tracker div:before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.tracker div:first-child:before{display:none}
.tracker i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--line);margin:0 auto 6px;position:relative;z-index:1;font-style:normal;font-size:12px;font-weight:700}
.tracker .done i{background:var(--g);border-color:var(--g);color:#fff}
.tracker .done:before,.tracker .cur:before,.tracker .warn:before,.tracker .stop:before{background:var(--g)}
.tracker .cur i{border-color:var(--g);background:var(--goldl)}
.tracker .cur{color:var(--ink);font-weight:650}
.tracker .warn i{border-color:#C2410C;background:#FDE7DC}
.tracker .warn{color:#9A3412;font-weight:650}
.tracker .stop i{border-color:var(--gray);background:var(--graybg)}
.tracker .stop{color:var(--gray);font-weight:650}
.hist{list-style:none;margin:0;padding:0}
.hist li{position:relative;padding:0 0 12px 18px;font-size:13.5px}
.hist li:before{content:"";position:absolute;left:3px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--g)}
.hist li:after{content:"";position:absolute;left:6.5px;top:17px;bottom:0;width:1px;background:var(--line)}
.hist li:last-child:after{display:none}
.hist .d{color:var(--mut);font-size:12.5px}

/* notifications */
.npanel{position:fixed;top:62px;right:16px;width:370px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:40;padding:8px}
.npanel h3{padding:8px 10px 4px}
.nitem{padding:9px 10px;border-radius:8px;font-size:13.5px}
.nitem.unread{background:var(--goldl)}
.nitem .d{font-size:12px;color:var(--mut)}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100vw;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:45;transform:translateX(105%);transition:transform .22s;overflow:auto;padding:18px}
#drawer.open{transform:none;visibility:visible}
#drawer:not(.open){visibility:hidden}
.cls{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.cls .ch{background:var(--gd);color:#fff;padding:6px 10px;font-weight:700;font-size:13.5px;display:flex;justify-content:space-between}
.cls .ch.dim{background:#5B6A62}
.obj{padding:7px 10px;border-top:1px solid var(--line2);font-family:Consolas,Menlo,monospace;font-size:11.8px;line-height:1.45;word-break:break-word}
.obj.new{background:#FFF7D6;box-shadow:inset 3px 0 0 var(--gold)}
.obj .k{color:#6A766F}
.txbox{background:var(--goldl);border:1px solid #EAD38A;border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px}

/* modal */
#modal:empty{display:none}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:60;display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg.wide{max-width:820px}
.dlg h2{font-size:19px}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;text-align:left}
.pick:hover{border-color:var(--g);background:var(--gl)}
.docview{border:1px solid var(--line);border-radius:8px;padding:22px 26px;background:#FEFEFC;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.6}
.docview h4{font-family:inherit;margin:14px 0 4px;font-size:15px}
.scale{display:flex;gap:6px;margin:14px 0 6px}
.scale button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:10px 0;font-weight:700;cursor:pointer}
.scale button.on{background:var(--g);color:#fff;border-color:var(--g)}
.scale-lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.sus td{padding:7px 6px;font-size:13.5px}
.sus td.o{text-align:center;width:44px}
.sus input{width:18px;height:18px;accent-color:var(--g)}
.cert{border:6px double var(--g);padding:26px 30px;text-align:center;position:relative;overflow:hidden;font-family:Georgia,serif}
.cert:after{content:"PROTOTYPE · SAMPLE ONLY";position:absolute;top:44%;left:-10%;width:120%;transform:rotate(-14deg);font:700 34px/1 "Segoe UI",Arial,sans-serif;color:rgba(180,35,24,.13);letter-spacing:.12em;pointer-events:none}
.cert .t1{font-size:13px;letter-spacing:.16em;color:var(--g);font-weight:700}
.cert .t2{font-size:26px;margin:12px 0 4px;letter-spacing:.06em}

/* metrics */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.metric{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.metric .v{font-size:24px;font-weight:700}
.metric .l{font-size:12.5px;color:var(--mut)}
.pass{color:var(--grn);font-weight:700}
.failc{color:var(--red);font-weight:700}
.na{color:var(--mut)}
.toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}

/* trace overlay */
body.trace [data-trace]{outline:2px dashed var(--gold);outline-offset:3px;position:relative}
body.trace [data-trace]:after{content:attr(data-trace);position:absolute;top:-11px;right:10px;background:var(--gold);color:#1d1600;font:700 11px/1.2 "Segoe UI",Arial,sans-serif;padding:3px 8px;border-radius:5px;z-index:5;white-space:nowrap;pointer-events:none}

@media (max-width:900px){
  .shell{flex-direction:column}
  #nav{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line);padding:8px;display:flex;gap:4px;overflow-x:auto}
  #nav .role,#nav .uname,#nav .urole{display:none}
  .navbtn{white-space:nowrap;width:auto;gap:8px}
  #main{padding:18px 14px 60px}
  .grid2,.grid2b{grid-template-columns:1fr}
  .docrow{grid-template-columns:1fr}
  .radio-cards{grid-template-columns:1fr}
  .tbar{top:auto}
  .top{position:static}
  .kv{grid-template-columns:1fr}
  .card{overflow-x:auto}
  td.mono{white-space:nowrap}
}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<div id="testbar"></div>
<div class="shell"><nav id="nav" aria-label="Main"></nav><main id="main"></main></div>
<aside id="drawer" aria-label="Domain data inspector"></aside>
<div id="npanel"></div>
<div id="modal"></div>
<input type="file" id="realfile" hidden>
<script>
"use strict";
/* =========================================================================
   RECMS working prototype
   Three transactional designs:
     T1  UC-01 Receive Research Proposal       (+ UC-13, UC-14, UC-15)
     T2  UC-04 Process Research Review / UC-09 Record Review Decision / UC-05
     T3  UC-07 Accept Resubmitted Proposal      (+ UC-13, UC-14, UC-15, UC-08)
   Data objects use the classes and attributes of the RECMS domain class diagram.
   ========================================================================= */

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fnm=s=>esc(s).replace(/([_.\-])/g,"$1<wbr>");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=iso=>{const d=new Date(iso);return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;};
const fmtDT=iso=>{const d=new Date(iso);let h=d.getHours();const m=String(d.getMinutes()).padStart(2,"0");const ap=h>=12?"PM":"AM";h=h%12||12;return `${fmtDate(iso)}, ${h}:${m} ${ap}`;};
const nowISO=()=>new Date().toISOString();
const addDays=(iso,n)=>{const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString();};
const daysAgo=(n,h=9,m=0)=>{const d=new Date();d.setDate(d.getDate()-n);d.setHours(h,m,0,0);return d.toISOString();};
const daysFromNow=(n)=>addDays(nowISO(),n);
const MB=1048576;
const fmtSize=b=>b>=MB?(b/MB).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const pad=(n,w=3)=>String(n).padStart(w,"0");
const toDateInput=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};

/* ---------------- reference data ---------------- */
const ROLES=[
  {roleID:"R1",roleName:"Researcher",description:"Submits and revises research proposals"},
  {roleID:"R2",roleName:"ERC Staff",description:"Verifies documents and issues clearances"},
  {roleID:"R3",roleName:"ERC Chair",description:"Assigns reviewers and routes re-reviews"},
  {roleID:"R4",roleName:"Reviewer",description:"Reviews proposals and records decisions"}
];
const USERS=[
  {userID:"u1",username:"creyes",contactNo:"0917 000 0001",name:"Carla M. Reyes",email:"creyes@example.edu",accountStatus:"Active",roleIDs:["R1"],label:"BS Nursing student"},
  {userID:"u2",username:"jsantos",contactNo:"0917 000 0002",name:"Joy A. Santos",email:"jsantos@example.edu",accountStatus:"Active",roleIDs:["R2"],label:"ERC Secretariat"},
  {userID:"u3",username:"ecruz",contactNo:"0917 000 0003",name:"Dr. Elena V. Cruz",email:"ecruz@example.edu",accountStatus:"Active",roleIDs:["R3","R4"],label:"ERC Chair and Reviewer"},
  {userID:"u4",username:"plim",contactNo:"0917 000 0004",name:"Dr. Paolo R. Lim",email:"plim@example.edu",accountStatus:"Active",roleIDs:["R4"],label:"ERC Reviewer"},
  {userID:"u5",username:"mvillanueva",contactNo:"0917 000 0005",name:"Mark T. Villanueva",email:"mvillanueva@example.edu",accountStatus:"Active",roleIDs:["R1"],label:"MAEd student"},
  {userID:"u6",username:"lgomez",contactNo:"0917 000 0006",name:"Liza P. Gomez",email:"lgomez@example.edu",accountStatus:"Active",roleIDs:["R1"],label:"Faculty researcher"},
  {userID:"u7",username:"ruy",contactNo:"0917 000 0007",name:"Ramon D. Uy",email:"ruy@example.edu",accountStatus:"Active",roleIDs:["R1"],label:"BS Biology student"}
];
const SWITCHABLE=["u1","u2","u3","u4"];
const RESEARCH_TYPES=["Undergraduate thesis","Graduate thesis or dissertation","Faculty research","External research"];
const DOC_TYPES=[

const reviewsOf=pid=>{const ids=asgOf(pid).map(a=>a.assignmentID);return DB.reviews.filter(r=>ids.includes(r.assignmentID));};
const latestReview=pid=>reviewsOf(pid).sort((a,b)=>b.reviewDate.localeCompare(a.reviewDate))[0];
const commentsOf=rid=>DB.comments.filter(c=>c.reviewID===rid);
const clearanceOf=pid=>DB.clearances.find(c=>c.proposalID===pid);
const roleNames=u=>u.roleIDs.map(r=>DB.roles.find(x=>x.roleID===r).roleName);
const hasRole=(uid,rn)=>roleNames(user(uid)).includes(rn);

const myProps=()=>DB.proposals.filter(p=>p.researcherID===ui.userID).sort((a,b)=>b.lastUpdated.localeCompare(a.lastUpdated));

/* ---------------- transaction recorder (shows the domain objects each transaction touches) ---------------- */
let TX=null;
const txBegin=name=>{TX={name,created:[],updated:[]};};
const txC=(cls,id)=>{if(TX)TX.created.push([cls,id]);};
const txU=(cls,id)=>{if(TX&&!TX.updated.some(x=>x[1]===id)&&!TX.created.some(x=>x[1]===id))TX.updated.push([cls,id]);};
const txEnd=()=>{ui.lastTx=TX;ui.changed=new Set([...TX.created,...TX.updated].map(x=>x[1]));TX=null;};
// UC-15 Send Notification
function ntype(m){return /assigned/i.test(m)?"Review assignment":/approved|disapproved|returned/i.test(m)?"Review decision":/clearance/i.test(m)?"Clearance":/revis/i.test(m)?"Revision":/received/i.test(m)?"Submission":"Status update";}
function notify(uid,message){const id="N"+pad(++DB.counters.ntf,4);DB.notifications.push({notificationID:id,userID:uid,notificationType:ntype(message),message,dateSent:nowISO(),dateRead:null,status:"Unread"});txC("Notification",id);}
// UC-14 Update Proposal Status
function setStatus(p,s){p.status=s;p.lastUpdated=nowISO();txU("ResearchProposal",p.proposalID);}
// UC-13 Validate Submitted Files
function validateFile(f){
  if(!f)return null;
  if(!/\.(pdf|docx)$/i.test(f.name))return "Only PDF or DOCX files are accepted.";
  if(f.size>10*MB)return `This file is ${fmtSize(f.size)}. The limit is 10 MB.`;
  if(f.size===0)return "This file is empty.";
  return null;
}

const T={session:null,taskIdx:0,running:false,start:0,errors:0,timer:null,setup:{code:"",expert:false},results:[]};
const STORE_KEY="recms_usability_results_v1";
try{const raw=localStorage.getItem(STORE_KEY);if(raw)T.results=JSON.parse(raw)||[];}catch(e){T.results=[];}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(T.results));}catch(e){}}
function countErrors(n){if(T.running&&n>0){T.errors+=n;renderTestBar();}}

function susScore(r){let s=0;for(let i=0;i<10;i++){s+=(i%2===0)?(r[i]-1):(5-r[i]);}return s*2.5;}
function geoMean(a){if(!a.length)return null;return Math.exp(a.reduce((s,x)=>s+Math.log(Math.max(x,0.5)),0)/a.length);}
const fmtSec=s=>{if(s==null)return "—";s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;};

function startSession(){
  const code=T.setup.code.trim();
  if(!code){ui.modal={type:"msg",title:"Participant code needed",body:"Enter a participant code such as P1 before starting."};render();return;}
  DB=seed();ui.changed=new Set();ui.lastTx=null;ui.w=null;ui.rv=null;ui.rs=null;ui.va={};ui.ca={};
  T.session={participant:code,expert:T.setup.expert,date:nowISO(),tasks:[],sus:null,susScore:null};
  T.taskIdx=0;ui.modal={type:"taskIntro"};render();
}
function beginTask(){
  const t=TASKS[T.taskIdx];ui.modal=null;ui.userID=t.user;ui.page=homeFor(t.user);ui.flash=null;ui.w=null;ui.rv=null;ui.rs=null;
  T.running=true;T.errors=0;T.start=performance.now();
  clearInterval(T.timer);T.timer=setInterval(()=>{const el=document.getElementById("clock");if(el)el.textContent=fmtSec((performance.now()-T.start)/1000);},500);
  render();window.scrollTo(0,0);
}
function endTask(success){
  if(!T.running)return;
  T.running=false;clearInterval(T.timer);
  const timeSec=(performance.now()-T.start)/1000;
  T.pending={id:TASKS[T.taskIdx].id,success,timeSec:Math.round(timeSec*10)/10,errors:T.errors,seq:null};
  ui.modal={type:"seq",val:null};render();
}
function emitTx(type,info){
  if(!T.running)return;
  const t=TASKS[T.taskIdx];if(t.id!==type)return;
  let ok=true;
  if(type==="T2")ok=info.pid==="ERC-2026-0141"&&info.decision==="Minor Revision"&&info.hasReq;
  if(type==="T3")ok=info.pid==="ERC-2026-0139";
  endTask(ok);
}
function submitSeq(v){
  T.pending.seq=v;T.session.tasks.push(T.pending);T.pending=null;T.taskIdx++;
  if(T.taskIdx<TASKS.length){ui.modal={type:"taskIntro"};}
  else{ui.modal={type:"sus",ans:Array(10).fill(null),err:false};}
  render();
}
function submitSus(){
  const ans=ui.modal.ans;
  if(ans.some(a=>a==null)){ui.modal.err=true;render();return;}
  T.session.sus=ans;T.session.susScore=susScore(ans);
  T.results.push(T.session);persist();
  const sc=T.session.susScore;T.session=null;
  ui.modal={type:"msg",title:"Session saved",body:`All three tasks are recorded. This participant's SUS score is ${sc.toFixed(1)}. The results are on the Usability test page.`};
  ui.page="test";render();
}
function abortSession(){T.running=false;clearInterval(T.timer);T.session=null;T.pending=null;ui.modal=null;go("test");}

/* ----- shared pieces ----- */
function trackerHTML(p){
  const cl=clearanceOf(p.proposalID);
  const labels=["Submitted","Documents verified","Under review","Decision","Clearance issued"];
  let st=["todo","todo","todo","todo","todo"];
  const fill=n=>{for(let i=0;i<n;i++)st[i]="done";};
  switch(p.status){
    case "For Verification": fill(1);st[1]="cur";break;
    case "For Reviewer Assignment": fill(2);st[2]="cur";labels[2]="Waiting for reviewer";break;
    case "Under Review": fill(2);st[2]="cur";if(p.versionNo>1)labels[2]=`Re-review (v${p.versionNo})`;break;
    case "For Re-review": fill(2);st[2]="cur";labels[2]=`Waiting for re-review (v${p.versionNo})`;break;
    case "Returned for Revision": fill(3);st[3]="warn";labels[3]="Revision requested";break;
    case "Approved": fill(4);labels[3]="Approved";if(cl){st[4]="done";}else st[4]="cur";break;
    case "Disapproved": fill(3);st[3]="stop";labels[3]="Disapproved";break;
  }
  return `<div class="tracker" data-trace="UC-11 Provide Proposal Status">${labels.map((l,i)=>`<div class="${st[i]==="done"?"done":st[i]}"><i>${st[i]==="done"?"✓":i+1}</i>${esc(l)}</div>`).join("")}</div>`;
}
function historyOf(pid){
  const p=prop(pid);const ev=[];
  const byVer={};docsOf(pid).forEach(d=>{(byVer[d.versionNo]=byVer[d.versionNo]||[]).push(d);});
  Object.entries(byVer).forEach(([v,ds])=>ev.push([ds[0].dateUploaded,v==="1"?`Proposal submitted with ${ds.length} document${ds.length>1?"s":""} (version 1)`:`${ds.length} revised document${ds.length>1?"s":""} uploaded (version ${v})`,uname(p.researcherID)]));
  const docIds=docsOf(pid).map(d=>d.documentID);const vs=DB.verifications.filter(v=>docIds.includes(v.documentID));
  [...new Set(vs.map(v=>v.verificationDate))].forEach(dt=>{const n=vs.filter(v=>v.verificationDate===dt);ev.push([dt,`${n.length} document${n.length>1?"s":""} verified`,uname(n[0].verifiedBy)]);});
  asgOf(pid).forEach(a=>ev.push([a.assignedDate,`Assigned to ${uname(a.reviewerID)} · due ${fmtDate(a.deadline)}`,uname(a.assignedBy)]));
  reviewsOf(pid).forEach(r=>{const a=asgById(r.assignmentID);ev.push([r.reviewDate,`Review submitted: ${r.decision} (${commentsOf(r.reviewID).length} comment${commentsOf(r.reviewID).length===1?"":"s"})`,uname(a.reviewerID)]);});
  DB.revisions.filter(r=>r.proposalID===pid).forEach(r=>ev.push([r.dateSubmitted,`Revision submitted as version ${r.versionNo}: "${r.revisionDescription.length>90?r.revisionDescription.slice(0,90)+"…":r.revisionDescription}"`,uname(p.researcherID)]));
  const cl=clearanceOf(pid);if(cl)ev.push([cl.dateIssued,`Ethics clearance ${cl.clearanceNo} issued`,"ERC Staff"]);
  return ev.sort((a,b)=>b[0].localeCompare(a[0]));
}

function wizardValidate(step){
  const w=ui.w;const e={};
  if(step===1){
    if(w.title.trim().length<10)e.title="Enter the full research title (at least 10 characters).";
    if(!w.researchType)e.researchType="Select the type of research.";
    if(w.description.trim().length<100)e.description=`Add a little more detail: ${w.description.trim().length} of at least 100 characters.`;
  }
  if(step===2){
    DOC_TYPES.forEach(d=>{const f=w.files[d.key];
      if(docRequired(d,w.researchType)&&(!f||f.error))e["doc_"+d.key]=f?"Replace the rejected file with a valid one.":`Attach the ${d.label.toLowerCase()}.`;
      else if(f&&f.error)e["doc_"+d.key]="Remove or replace the rejected file.";});
  }
  if(step===3){if(!w.certify)e.certify="Tick the certification box to submit.";}
  return e;
}
function wizardNext(){
  const w=ui.w;const e=wizardValidate(w.step);w.errors=e;const n=Object.keys(e).length;

}
function submitProposal(){

  if(n){countErrors(n);if(e.title||e.researchType||e.description)w.step=1;else if(Object.keys(e).some(k=>k.startsWith("doc_")))w.step=2;render();focusFirstError();return;}
  txBegin("UC-01 Receive Research Proposal");
  const pid="ERC-2026-"+pad(++DB.counters.prop,4);const t=nowISO();
  const p={proposalID:pid,title:w.title.trim(),description:w.description.trim(),researchType:w.researchType,dateSubmitted:t,status:"Received",versionNo:1,researcherID:ui.userID,lastUpdated:t};
  DB.proposals.push(p);txC("ResearchProposal",pid);
  DOC_TYPES.forEach(d=>{const f=w.files[d.key];if(f&&!f.error){const id=addDocument(DB,pid,d.label,f.name,f.size,1,t,"Submitted");txC("ResearchDocument",id);}});
  setStatus(p,"For Verification");

function reviseValidate(){
  const rs=ui.rs;const e={};
  currentDocs(rs.pid).forEach(d=>{const f=rs.files[d.documentID];
    if(f&&f.error)e["f_"+d.documentID]=`${d.documentType}: "${f.name}" was rejected. ${f.error}`;
    else if(rs.flagged.includes(d.documentID)&&!f)e["f_"+d.documentID]=`Upload a revised ${d.documentType.toLowerCase()}. The reviewer asked for changes to it.`;});
  const good=Object.values(rs.files).filter(f=>f&&!f.error).length;
  if(!good&&!Object.keys(e).length)e.none="Upload at least one revised document.";
  if(rs.desc.trim().length<30)e.desc=`Describe the changes you made (${rs.desc.trim().length} of at least 30 characters).`;
  return e;
}

  ui.modal={type:"confirmRevise"};render();

/* ----- usability test page ----- */
function computeSummary(){
  const parts=T.results.filter(s=>!s.expert);const experts=T.results.filter(s=>s.expert);
  return TASKS.map(t=>{
    const rows=parts.map(s=>s.tasks.find(x=>x.id===t.id)).filter(Boolean);
    const ok=rows.filter(r=>r.success);
    const ex=experts.map(s=>s.tasks.find(x=>x.id===t.id)).filter(r=>r&&r.success).map(r=>r.timeSec);
    const exT=ex.length?geoMean(ex):null;
    return {t,n:rows.length,rate:rows.length?ok.length/rows.length:null,time:geoMean(ok.map(r=>r.timeSec)),exT,target:exT?exT*1.5:null,
      err:rows.length?rows.reduce((s,r)=>s+r.errors,0)/rows.length:null,seq:rows.length?rows.reduce((s,r)=>s+r.seq,0)/rows.length:null};
  });
}
const pf=(ok)=>ok==null?'<span class="na">no data</span>':ok?'<span class="pass">Meets target</span>':'<span class="failc">Below target</span>';
function susLabel(s){if(s==null)return "";if(s>=80.3)return "Excellent (A, top 10%)";if(s>=68)return "Above average";if(s>=51)return "Below average";return "Poor (F, bottom 15%)";}

  const sus=parts.length?parts.reduce((a,s)=>a+s.susScore,0)/parts.length:null;
  return `<h1>Usability test</h1><p class="sub">Measures the two selected metric categories while a participant performs the three transactions. Results stay in this browser only; use Copy CSV to keep them.</p>
  <div class="grid2"><div class="card"><h2>Metric categories and targets</h2>
    <h3>1. Task performance (effectiveness and efficiency)</h3>
    <ul class="small" style="margin:0 0 10px 18px;padding:0"><li><b>Task success rate</b>: completed ÷ attempted. Target ≥ 80%.</li><li><b>Time on task</b>: geometric mean of successful times (best for samples under 25). Target ≤ 1.5 × expert time.</li><li><b>Error rate</b>: errors per attempt (validation messages plus facilitator-logged slips). Target ≤ 0.7.</li></ul>
    <h3>2. User satisfaction (perceived usability)</h3>
    <ul class="small" style="margin:0 0 0 18px;padding:0"><li><b>SEQ</b> after each task, 1 to 7. Target ≥ 5.5.</li><li><b>SUS</b> after all tasks, 0 to 100. Target ≥ 68 (average); goal ≥ 80.3.</li></ul></div>
  <div class="card"><h2>Start a session</h2>
    ${T.session?`<p>A session for <b>${esc(T.session.participant)}</b> is in progress.</p><button class="btn danger" data-act="abort">Abort session</button>`:`
    <div class="field"><label class="lb" for="f-pc">Participant code</label><input type="text" id="f-pc" data-bind="T.code" value="${esc(T.setup.code)}" placeholder="P1"></div>
    <label class="row" style="gap:8px;margin-bottom:14px;cursor:pointer"><input type="checkbox" data-bind="T.expert" ${T.setup.expert?"checked":""} style="width:18px;height:18px;accent-color:#0B5A38;flex:none"><span style="flex:1">This run is the <b>expert baseline</b> (designer, no errors). Used only to set the time target.</span></label>
    <button class="btn pri" data-act="startSession">Start test session</button>
    <p class="small muted" style="margin-top:10px">Starting resets the demo data so every participant begins from the same state.</p>`}
  </div></div>
  <div class="card"><h2>Task scripts (read aloud to the participant)</h2>${TASKS.map((t,i)=>`<p><b>Task ${i+1}. ${esc(t.name)}</b> <span class="tag">${esc(t.uc)}</span><br><span class="muted">${esc(t.scenario)}</span></p>`).join("")}</div>
  <div class="card"><h2>Results summary</h2><p class="small muted">${parts.length} participant session${parts.length===1?"":"s"} · ${T.results.length-parts.length} expert baseline run${T.results.length-parts.length===1?"":"s"} (excluded from averages)</p>
    <table><thead><tr><th>Task</th><th>n</th><th>Success rate</th><th>Avg. time (geo.)</th><th>Errors / attempt</th><th>SEQ (1–7)</th></tr></thead><tbody>
    ${sum.map(s=>`<tr><td><b>${esc(s.t.id)}</b> ${esc(s.t.name)}</td><td>${s.n}</td>
      <td>${s.rate==null?"—":Math.round(s.rate*100)+"%"}<div class="small">${pf(s.rate==null?null:s.rate>=.8)}</div></td>
      <td>${fmtSec(s.time)}<div class="small">${s.target?`target ≤ ${fmtSec(s.target)} · ${pf(s.time==null?null:s.time<=s.target)}`:'<span class="na">record an expert run</span>'}</div></td>
      <td>${s.err==null?"—":s.err.toFixed(2)}<div class="small">${pf(s.err==null?null:s.err<=.7)}</div></td>
      <td>${s.seq==null?"—":s.seq.toFixed(1)}<div class="small">${pf(s.seq==null?null:s.seq>=5.5)}</div></td></tr>`).join("")}
    </tbody></table>
    <div class="mgrid" style="margin-top:14px"><div class="metric"><div class="l">Mean SUS score</div><div class="v">${sus==null?"—":sus.toFixed(1)}</div><div class="small">${sus==null?'<span class="na">no data</span>':esc(susLabel(sus))+" · "+pf(sus>=68)}</div></div></div>
  </div>
  <div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Raw data</h2><span class="spacer"></span><button class="btn sm" data-act="copyCsv" ${T.results.length?"":"disabled"}>Copy CSV</button><button class="btn sm danger" data-act="askClear" ${T.results.length?"":"disabled"}>Clear all</button></div>

  </div>`;
}
function csv(){
  const rows=[["participant","expert_baseline","date","task","success","time_sec","errors","seq","sus_score","sus_items"]];
  T.results.forEach(s=>s.tasks.forEach(r=>rows.push([s.participant,s.expert?1:0,s.date,r.id,r.success?1:0,r.timeSec,r.errors,r.seq,s.susScore,s.sus.join(" ")])));
  return rows.map(r=>r.map(v=>{const x=String(v);return /[",\n]/.test(x)?`"${x.replace(/"/g,'""')}"`:x;}).join(",")).join("\n");
}

function docPreviewHTML(d){
  const p=prop(d.proposalID);
  const head=`<div class="small muted" style="margin-bottom:8px">${esc(d.fileName)} · v${d.versionNo} · simulated preview</div>`;
  if(d.documentType==="Informed consent form"){
    const special=d.proposalID==="ERC-2026-0141"&&d.versionNo===1;
    return head+`<div class="docview"><b>INFORMED CONSENT FORM</b><br><i>${esc(p.title)}</i>
      <h4>Purpose of the study</h4>You are invited to take part in a study that looks at ${special?"how ready senior high school students are to learn using mobile devices":"the topic described in the title above"}.
      <h4>What you will be asked to do</h4>You will answer a questionnaire that takes about 20 minutes.
      <h4>Risks and discomforts</h4>There are no known risks beyond those of everyday life. Some questions about home internet access may feel personal.
      <h4>Benefits</h4>There is no direct benefit to you. The results may help schools plan mobile learning support.
      <h4>Confidentiality</h4>Your answers will be coded and kept in a locked file. Only the researcher and adviser will see them.
      ${special?"":"<h4>Voluntary participation and withdrawal</h4>Taking part is voluntary. You may stop at any time without penalty, and your answers will be deleted if you ask."}
      <h4>Contact</h4>For questions, contact the researcher or the NDDU Ethics Research Committee.
      <p style="margin-top:14px">Signature of participant: ____________________ &nbsp; Date: __________</p></div>`;
  }
  if(d.documentType==="Research protocol")return head+`<div class="docview"><b>RESEARCH PROTOCOL</b><br><i>${esc(p.title)}</i><h4>1. Background and rationale</h4>${esc(p.description)}<h4>2. Objectives</h4>To describe the current situation and identify factors related to it.<h4>3. Methods</h4>Design, setting, participants and sampling, instruments, data collection procedure, and analysis plan.<h4>4. Ethical considerations</h4>Informed consent, confidentiality, data storage, and risk management.</div>`;
  if(d.documentType==="Data collection instrument")return head+`<div class="docview"><b>DATA COLLECTION INSTRUMENT</b><br><i>${esc(p.title)}</i><h4>Part I. Profile</h4>Age, sex, grade level or occupation, and location.<h4>Part II. Main scale</h4>Items rated from 1 (strongly disagree) to 5 (strongly agree).<h4>Part III. Open-ended questions</h4>Three short questions about the participant's experience.</div>`;

/* ---------------- events ---------------- */
function setBind(path,val){
  if(path.startsWith("T.")){T.setup[path.slice(2)]=val;return;}
  if(path==="search"){ui.search=val;return;}
  const parts=path.split(".");let o=ui;
  for(let i=0;i<parts.length-1;i++){if(o[parts[i]]==null)o[parts[i]]={};o=o[parts[i]];}
  o[parts[parts.length-1]]=val;
}
document.addEventListener("input",e=>{
  const f=e.target.closest("[data-bind]");if(!f||f.type==="radio"||f.type==="checkbox"||f.tagName==="SELECT")return;
  setBind(f.dataset.bind,f.value);
  const c=document.querySelector(`[data-counter="${f.dataset.bind}"]`);if(c)c.textContent=`${f.value.trim().length} characters · at least ${f.dataset.min}`;
  if(f.dataset.live){const pos=f.selectionStart;renderMain();const n=document.querySelector('[data-bind="search"]');if(n){n.focus();n.setSelectionRange(pos,pos);}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="userSel"){ui.userID=t.value;ui.flash=null;go(homeFor(t.value));return;}
  if(t.id==="realfile"){const f=t.files&&t.files[0];if(f&&ui.modal&&ui.modal.type==="picker")assignFile({name:f.name,size:f.size});t.value="";return;}
  const f=t.closest("[data-bind]");if(!f)return;
  if(f.type==="checkbox")setBind(f.dataset.bind,f.checked);
  else if(f.type==="radio"){if(f.checked){setBind(f.dataset.bind,f.value);if(ui.rv&&ui.rv.errors)delete ui.rv.errors.decision;render();}}
  else setBind(f.dataset.bind,f.value);
});
function assignFile(file){
  const m=ui.modal;const err=validateFile(file);const rec={name:file.name,size:file.size,error:err};
  if(m.ctx==="w"){ui.w.files[m.slot]=rec;if(ui.w.errors)delete ui.w.errors["doc_"+m.slot];}
  else{ui.rs.files[m.slot]=rec;if(ui.rs.errors)delete ui.rs.errors["f_"+m.slot];}
  ui.modal=null;if(err)countErrors(1);render();
}

  unpick:el=>{if(el.dataset.ctx==="w")delete ui.w.files[el.dataset.slot];else delete ui.rs.files[el.dataset.slot];render();},
  pickSample:el=>assignFile(SAMPLE_FILES[+el.dataset.i]),
  pickReal:()=>document.getElementById("realfile").click(),
  preview:el=>{ui.modal={type:"preview",doc:el.dataset.doc};render();},
  closeModal:()=>{ui.modal=null;render();},
  overlayClose:(el,e)=>{if(e.target===el){ui.modal=null;render();}},
  noop:()=>{},
  startRevise:el=>startRevise(el.dataset.pid),
  reviseCheck:()=>reviseCheck(),
  recordRevision:()=>recordRevision(),
  vcheck:el=>{(ui.va[el.dataset.pid]||(ui.va[el.dataset.pid]={}))[el.dataset.doc]=el.checked;},
  verify:el=>verifyDocs(el.dataset.pid),
  genClear:el=>generateClearance(el.dataset.pid),
  cert:el=>{ui.modal={type:"cert",pid:el.dataset.pid};render();},
  assign:el=>assignReviewer(el.dataset.pid),
  startReview:el=>startReview(el.dataset.aid),
  addComment:()=>addComment(),
  rmComment:el=>{ui.rv.comments.splice(+el.dataset.i,1);render();},
  reviewCheck:()=>reviewCheck(),
  recordReview:()=>recordReview(),
  startSession:()=>startSession(),
  beginTask:()=>beginTask(),
  abort:()=>abortSession(),
  logError:()=>countErrors(1),
  failTask:()=>endTask(false),
  seqPick:el=>{ui.modal.val=+el.dataset.v;renderModal();},
  seqSubmit:()=>{if(ui.modal.val)submitSeq(ui.modal.val);},
  susPick:el=>{ui.modal.ans[+el.dataset.i]=+el.dataset.v;},
  susSubmit:()=>submitSus(),
  toggleSuccess:el=>{const r=T.results[+el.dataset.si].tasks[+el.dataset.ti];r.success=!r.success;persist();render();},
  delSession:el=>{T.results.splice(+el.dataset.si,1);persist();render();},
  askClear:()=>{ui.modal={type:"confirm",title:"Clear all results?",body:"This deletes every recorded session in this browser. Copy the CSV first if you need it.",yes:"doClear",yesLabel:"Clear all"};render();},
  doClear:()=>{T.results=[];persist();ui.modal=null;render();},
  askReset:()=>{ui.modal={type:"confirm",title:"Reset demo data?",body:"All proposals return to their starting state. Usability results are not affected.",yes:"doReset",yesLabel:"Reset"};render();},
  doReset:()=>{DB=seed();ui.changed=new Set();ui.lastTx=null;ui.w=null;ui.rv=null;ui.rs=null;ui.va={};ui.ca={};ui.modal=null;go(homeFor(ui.userID));},
  copyCsv:async()=>{const text=csv();let copied=false;try{await navigator.clipboard.writeText(text);copied=true;}catch(e){}ui.modal={type:"csv",text,copied};render();}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el){if(ui.notifOpen&&!e.target.closest(".npanel")){ui.notifOpen=false;renderNotif();renderHeader();}return;}
  if(el.tagName==="INPUT"&&el.type==="checkbox"&&el.dataset.act==="vcheck"){A.vcheck(el);return;}
  if(el.tagName==="INPUT"&&el.type==="radio"&&el.dataset.act==="susPick"){A.susPick(el);return;}
  const fn=A[el.dataset.act];if(fn){if(el.tagName==="BUTTON"||el.tagName==="TR"||el.classList.contains("overlay"))e.preventDefault();fn(el,e);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.modal&&!["seq","sus","taskIntro"].includes(ui.modal.type)){ui.modal=null;render();}});

DB=seed();
render();
</script>
</body>
</html>
